services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: waypoint
      MYSQL_USER: waypoint
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./server/Waypoint.Api
      args:
        CLAUDE_CLI: ${COACH_USE_CLAUDE_CLI:-false}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Waypoint: "Server=db;Database=waypoint;User=waypoint;Password=${MYSQL_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env (32+ random characters)}
      Google__ClientIds__0: ${GOOGLE_WEB_CLIENT_ID:?set GOOGLE_WEB_CLIENT_ID in .env}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      # Development only: COACH_USE_CLAUDE_CLI=true runs the Coach on your Claude subscription, not the API key.
      ClaudeCli__Enabled: ${COACH_USE_CLAUDE_CLI:-false}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      Firebase__ServiceAccountFile: /run/secrets/firebase-service-account.json
    volumes:
      - ./secrets:/run/secrets:ro
    ports:
      - "8080:8080"

  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: waypoint
      MYSQL_USER: root
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE in .env (keep a copy off this machine)}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-03}
      BACKUP_RETENTION_DAYS: 30
    volumes:
      # Must be storage that is not this machine's disk: a mounted cloud drive, NAS or synced folder.
      - ${BACKUP_DIR:?set BACKUP_DIR in .env to an off-machine location}:/backups

volumes:
  db-data:
